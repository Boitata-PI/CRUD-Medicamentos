name: CI Pipeline
 
on:
 push:
   branches: [ "Develop" ]
 pull_request:
   branches: [ "Develop" ]
 
jobs:
 build-and-test:
   runs-on: ubuntu-latest
 
   steps:
   - name: Checkout código
     uses: actions/checkout@v3
 
   - name: Setup Python
     uses: actions/setup-python@v4
     with:
       python-version: '3.10'
 
   - name: Instalar dependências
     run: |
      python -m pip install --upgrade pip
       pip install pytest
 
   - name: Rodar testes
     run: |
      pytest